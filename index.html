  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الجلوس الصحيح على الكرسي الصفّي</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e8f4fd 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 14px 20px;
    height: 100vh;
  }
  .header { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
  .title { font-size: 20px; font-weight: 800; color: #3a3a5c; margin: 4px 0; }
  .subtitle { font-size: 13px; color: #888; font-weight: 600; }

  .levels-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    width: 100%; max-width: 500px; gap: 16px; flex: 1; margin-top: 8px;
  }
  .levels-screen.hidden { display: none; }
  .level-card {
    display: flex; align-items: center; gap: 16px; width: 100%;
    background: #fff; border-radius: 18px; padding: 14px 18px;
    box-shadow: 0 5px 16px rgba(0,0,0,0.1); cursor: pointer;
    border: 3px solid transparent; transition: transform .15s ease;
  }
  .level-card:active { transform: scale(0.97); }
  .level-card .icon { font-size: 36px; }
  .level-card .info { flex: 1; text-align: right; }
  .level-card .info .lvl-title { font-size: 17px; font-weight: 800; color: #3a3a5c; }
  .level-card .info .lvl-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .level-card .stars-mini { font-size: 15px; color: #ffca3a; min-width: 46px; text-align: left; }

  .sound-toggle {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 10;
  }
  .sound-toggle:active { transform: scale(0.92); }

  .prompt-row {
    display: none; align-items: center; gap: 10px; margin: 4px 0 6px;
    width: 100%; max-width: 400px; flex-shrink: 0;
  }
  .prompt-row.show { display: flex; }
  .prompt-box {
    background: #fff; border-radius: 16px; padding: 10px 18px; flex: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08); font-size: 16px; font-weight: 700;
    color: #5b4b8a; text-align: center;
  }
  .speak-btn {
    background: #6c5ce7; border: none; border-radius: 50%;
    width: 38px; height: 38px; font-size: 16px; color: white; cursor: pointer;
    box-shadow: 0 3px 10px rgba(108,92,231,0.35); flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(108,92,231,0.5);} to { box-shadow: 0 0 0 8px rgba(108,92,231,0);} }

  .back-row { width: 100%; max-width: 500px; display: none; flex-shrink: 0; }
  .back-row.show { display: flex; }
  .back-btn { background: none; border: none; color: #6c5ce7; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 2px; }

  .progress { display: flex; gap: 8px; margin: 4px 0 6px; display: none; flex-shrink: 0; }
  .progress.show { display: flex; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0dcf2; transition: all .25s ease; }
  .dot.done { background: #4caf50; transform: scale(1.15); }
  .dot.current { background: #6c5ce7; transform: scale(1.3); box-shadow: 0 0 0 3px #d9d3f8; }

  .game-area {
    display: none; flex-direction: column; align-items: center; width: 100%;
    flex: 1; min-height: 0; justify-content: flex-start; overflow-y: auto;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
  }
  .card {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    cursor: pointer;
    border: 5px solid transparent;
    transition: transform .15s ease, border-color .2s ease;
    flex-shrink: 0;
  }
  .card:active { transform: scale(0.98); }
  .card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #f0eef8;
    display: block;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: auto;
  }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 34px;
    opacity: 0; transform: scale(0.4); transition: all .3s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .badge.show { opacity: 1; transform: scale(1); }
  .card.correct { border-color: #4caf50; }
  .card.wrong-flash { border-color: #ff7675; }
  .card.locked { cursor: default; }
  .card.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback { min-height: 26px; margin-top: 10px; font-size: 15px; font-weight: 700; text-align: center; color: #3a3a5c; flex-shrink: 0; }

  .summary {
    display: none; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%;
  }
  .summary.show { display: flex; }
  .summary h2 { font-size: 22px; color: #3a3a5c; margin: 6px 0; }
  .summary .score { font-size: 34px; font-weight: 900; color: #6c5ce7; margin: 8px 0; }
  .summary .stars { font-size: 30px; margin: 6px 0 12px; letter-spacing: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .restart-btn, .levels-btn {
    padding: 11px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 28px;
    color: white; cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,0.2);
  }
  .restart-btn { background: #4caf50; }
  .levels-btn { background: #6c5ce7; }
  .restart-btn:active, .levels-btn:active { transform: scale(0.96); }
  #summaryMsg { font-size: 14px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle">🔊</button>

<div class="header">
  <div class="title">🪑 ما هو السلوك الصحيح عند الجلوس في الغرفة الصفية؟ 🪑</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <div class="level-card lvl1" data-level="1">
    <div class="icon">🪑</div>
    <div class="info">
      <div class="lvl-title">المستوى الأول</div>
      <div class="lvl-sub">اختر بين صورتين</div>
    </div>
    <div class="stars-mini" id="starsL1"></div>
  </div>
  <div class="level-card lvl2" data-level="2">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="lvl-title">المستوى الثاني</div>
      <div class="lvl-sub">اختر بين ثلاث صور</div>
    </div>
    <div class="stars-mini" id="starsL2"></div>
  </div>
</div>

<div class="back-row" id="backRow">
  <button class="back-btn" id="backBtn">➡️ العودة للمستويات</button>
</div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn">🔈</button>
  <div class="prompt-box" id="promptBox">ما هو السلوك الصحيح عند الجلوس في الغرفة الصفية؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

/* ===== Level configuration =====
   Level 1: correct image + 1 wrong image (2 choices)
   Level 2: correct image + 2 wrong images (3 choices)
   5 repetitions per level, images reshuffled each repetition */
const LEVELS = {
  1: { correct: CORRECT_IMG, wrongs: [WRONG_FLOOR_IMG] },
  2: { correct: CORRECT_IMG, wrongs: [WRONG_TABLE_IMG, WRONG_STAND_IMG] }
};
const REPS_PER_LEVEL = 5;
const WRONG_MARK_DURATION = 2000;   /* ms - how long the ❌ stays before it's removed */
const NEXT_REP_BUFFER = 120;        /* ms - tiny pause after "ممتاز" audio ends before next rep starts */
const REP_START_DELAY = 0;          /* ms - question is read immediately when the repetition starts */

/* ===== State ===== */
let soundOn = true;
let currentLevel = null;
let currentRep = 0;
let mistakesThisLevel = 0;
let answered = false;
let starsByLevel = { 1: 0, 2: 0 };
let lastOrderKey = null;

/* ===== Audio helpers ===== */
const questionAudio = new Audio(QUESTION_AUDIO);
const correctAudio  = new Audio(CORRECT_AUDIO);
const wrongAudio     = new Audio(WRONG_AUDIO);
[questionAudio, correctAudio, wrongAudio].forEach(a => { a.volume = 1.0; a.preload = "auto"; });

function playAudio(audioEl, onEnded) {
  if (!soundOn) { if (onEnded) onEnded(); return; }
  audioEl.pause();
  audioEl.currentTime = 0;
  audioEl.volume = 1.0;
  const cleanup = () => {
    audioEl.removeEventListener('ended', handler);
    if (onEnded) onEnded();
  };
  const handler = () => cleanup();
  audioEl.addEventListener('ended', handler);
  const p = audioEl.play();
  if (p && p.catch) {
    p.catch(() => { cleanup(); });
  }
}

/* ===== DOM refs ===== */
const levelsScreen = document.getElementById('levelsScreen');
const backRow = document.getElementById('backRow');
const promptRow = document.getElementById('promptRow');
const progressEl = document.getElementById('progress');
const gameArea = document.getElementById('gameArea');
const cardsEl = document.getElementById('cards');
const feedbackEl = document.getElementById('feedback');
const summaryEl = document.getElementById('summary');
const soundToggle = document.getElementById('soundToggle');
const speakBtn = document.getElementById('speakBtn');
const starsL1 = document.getElementById('starsL1');
const starsL2 = document.getElementById('starsL2');

function starsString(n) {
  const total = 3;
  let s = '';
  for (let i = 0; i < total; i++) s += (i < n ? '⭐' : '☆');
  return s;
}
function refreshLevelStars() {
  starsL1.textContent = starsByLevel[1] ? starsString(starsByLevel[1]) : '';
  starsL2.textContent = starsByLevel[2] ? starsString(starsByLevel[2]) : '';
}
refreshLevelStars();

soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
});

document.querySelectorAll('.level-card').forEach(card => {
  card.addEventListener('click', () => startLevel(parseInt(card.dataset.level, 10)));
});

document.getElementById('backBtn').addEventListener('click', showLevels);
document.getElementById('levelsBtn').addEventListener('click', showLevels);
document.getElementById('restartBtn').addEventListener('click', () => startLevel(currentLevel));

speakBtn.addEventListener('click', () => {
  speakBtn.classList.add('speaking');
  playAudio(questionAudio, () => speakBtn.classList.remove('speaking'));
});

function showLevels() {
  currentLevel = null;
  levelsScreen.classList.remove('hidden');
  backRow.classList.remove('show');
  promptRow.classList.remove('show');
  progressEl.classList.remove('show');
  gameArea.style.display = 'none';
  summaryEl.classList.remove('show');
  refreshLevelStars();
}

function startLevel(level) {
  currentLevel = level;
  currentRep = 0;
  mistakesThisLevel = 0;
  lastOrderKey = null;

  levelsScreen.classList.add('hidden');
  backRow.classList.add('show');
  promptRow.classList.add('show');
  progressEl.classList.add('show');
  gameArea.style.display = 'flex';
  summaryEl.classList.remove('show');

  buildProgressDots();
  startRep();
}

function buildProgressDots() {
  progressEl.innerHTML = '';
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    progressEl.appendChild(d);
  }
  updateProgressDots();
}
function updateProgressDots() {
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const d = document.getElementById('dot' + i);
    d.classList.remove('done', 'current');
    if (i < currentRep) d.classList.add('done');
    else if (i === currentRep) d.classList.add('current');
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startRep() {
  answered = false;
  updateProgressDots();
  feedbackEl.textContent = '';
  cardsEl.innerHTML = '';

  const cfg = LEVELS[currentLevel];
  const baseOptions = [
    { src: cfg.correct, correct: true },
    ...cfg.wrongs.map(w => ({ src: w, correct: false }))
  ];

  let options = shuffle(baseOptions);
  let orderKey = options.map(o => o.src.slice(-24)).join('|');
  let attempts = 0;
  while (orderKey === lastOrderKey && attempts < 10) {
    options = shuffle(baseOptions);
    orderKey = options.map(o => o.src.slice(-24)).join('|');
    attempts++;
  }
  lastOrderKey = orderKey;

  options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.correct = opt.correct ? '1' : '0';
    card.innerHTML = `<img src="${opt.src}" alt="خيار" draggable="false"><div class="badge" id="badge${idx}"></div>`;
    card.addEventListener('click', () => onCardTap(card, opt.correct, idx));
    cardsEl.appendChild(card);
  });

  setTimeout(() => {
    playAudio(questionAudio);
  }, REP_START_DELAY);
}

function onCardTap(card, isCorrect, idx) {
  if (answered) return;

  if (isCorrect) {
    answered = true;
    document.querySelectorAll('.card').forEach(c => c.classList.add('locked'));
    card.classList.add('correct');
    const badge = document.getElementById('badge' + idx);
    badge.textContent = '✅';
    badge.classList.add('show');
    feedbackEl.textContent = 'ممتاز! 🎉';

    playAudio(correctAudio, () => {
      setTimeout(() => {
        currentRep++;
        if (currentRep >= REPS_PER_LEVEL) {
          finishLevel();
        } else {
          startRep();
        }
      }, NEXT_REP_BUFFER);
    });
  } else {
    mistakesThisLevel++;
    card.classList.add('wrong-flash', 'shake');
    const badge = document.getElementById('badge' + idx);
    badge.textContent = '❌';
    badge.classList.add('show');
    feedbackEl.textContent = 'حاول مرة أخرى 💪';

    playAudio(wrongAudio);

    setTimeout(() => {
      card.classList.remove('wrong-flash', 'shake');
      badge.classList.remove('show');
      badge.textContent = '';
    }, WRONG_MARK_DURATION);
  }
}

function finishLevel() {
  gameArea.style.display = 'none';
  progressEl.classList.remove('show');
  promptRow.classList.remove('show');
  backRow.classList.remove('show');
  summaryEl.classList.add('show');

  let stars = 3;
  if (mistakesThisLevel > 6) stars = 1;
  else if (mistakesThisLevel > 2) stars = 2;
  starsByLevel[currentLevel] = Math.max(starsByLevel[currentLevel], stars);

  document.getElementById('scoreText').textContent = `${REPS_PER_LEVEL} / ${REPS_PER_LEVEL}`;
  document.getElementById('starsText').textContent = starsString(stars);
  document.getElementById('summaryMsg').textContent =
    mistakesThisLevel === 0 ? 'أحسنت! أجبت بشكل صحيح من أول مرة في كل مرة 👏'
    : `أكملت المستوى بعد ${mistakesThisLevel} محاولة إضافية 💪`;
}
</script>
